name: Asia Sweep Reversals Check

on:
  # No built-in `schedule:` trigger -- GitHub Actions' schedule event is
  # best-effort and throttles badly at minute cadence (CLAUDE.md sections
  # 7/14). An external precise pinger (cron-job.org, every 1 minute)
  # calls this workflow's dispatch API instead. The runner re-checks the
  # real, configurable NY window (asia_sweep_session.py) before doing
  # anything, so an off-hours ping is a harmless no-op.
  workflow_dispatch: {}

permissions:
  contents: write

# One extra 1-minute ping is harmless (dedup guard in alert_state.py),
# but overlapping runs racing to commit the state marker are wasteful --
# let a run finish before the next starts.
concurrency:
  group: asia-sweep-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Asia Sweep check (all 4 pairs)
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENVIRONMENT: ${{ secrets.OANDA_ENVIRONMENT }}
          ACCOUNT_SIZES: ${{ secrets.ACCOUNT_SIZES }}
          RISK_PERCENTAGES: ${{ secrets.RISK_PERCENTAGES }}
          ASIA_SWEEP_WINDOW_START: ${{ secrets.ASIA_SWEEP_WINDOW_START }}
          ASIA_SWEEP_WINDOW_END: ${{ secrets.ASIA_SWEEP_WINDOW_END }}
          ASIA_SWEEP_WINDOW_TZ: ${{ secrets.ASIA_SWEEP_WINDOW_TZ }}
          ASIA_SWEEP_TRADING_DAYS: ${{ secrets.ASIA_SWEEP_TRADING_DAYS }}
          ASIA_SWEEP_SESSION: ${{ secrets.ASIA_SWEEP_SESSION }}
          ASIA_SWEEP_TIMEZONE: ${{ secrets.ASIA_SWEEP_TIMEZONE }}
          ASIA_SWEEP_INTERNAL_LENGTH: ${{ secrets.ASIA_SWEEP_INTERNAL_LENGTH }}
          ASIA_SWEEP_BREAK_MODE: ${{ secrets.ASIA_SWEEP_BREAK_MODE }}
          ASIA_SWEEP_MAX_BARS_AFTER_SWEEP: ${{ secrets.ASIA_SWEEP_MAX_BARS_AFTER_SWEEP }}
          ASIA_SWEEP_STOP_BUFFER_TICKS: ${{ secrets.ASIA_SWEEP_STOP_BUFFER_TICKS }}
          ASIA_SWEEP_TREND_FILTER: ${{ secrets.ASIA_SWEEP_TREND_FILTER }}
          ASIA_SWEEP_TREND_EMA_LENGTH: ${{ secrets.ASIA_SWEEP_TREND_EMA_LENGTH }}
          ASIA_SWEEP_TARGET_MULTIPLES: ${{ secrets.ASIA_SWEEP_TARGET_MULTIPLES }}
          ASIA_SWEEP_REWARD_RR: ${{ secrets.ASIA_SWEEP_REWARD_RR }}
          ASIA_SWEEP_LOOKBACK_BARS: ${{ secrets.ASIA_SWEEP_LOOKBACK_BARS }}
          ASIA_SWEEP_TELEGRAM_BOT_TOKEN: ${{ secrets.ASIA_SWEEP_TELEGRAM_BOT_TOKEN }}
          ASIA_SWEEP_TELEGRAM_CHAT_IDS: ${{ secrets.ASIA_SWEEP_TELEGRAM_CHAT_IDS }}
        run: python -m src.asia_sweep_check_runner

      - name: Commit updated alert-state markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ls state/last_alert_*_asia_*.json >/dev/null 2>&1; then
            git add state/last_alert_*_asia_*.json
            git diff --cached --quiet || git commit -m "Update Asia Sweep alert state [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push failed (attempt $attempt) -- fetching and rebasing, then retrying."
              git fetch origin main
              git rebase origin/main
            done
          else
            echo "No Asia Sweep alert-state markers yet -- nothing to commit."
          fi

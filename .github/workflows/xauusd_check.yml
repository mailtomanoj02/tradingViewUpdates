name: XAUUSD HalfTrend Check

on:
  # No built-in `schedule:` trigger here on purpose. GitHub Actions'
  # schedule event is documented as best-effort and gets delayed/dropped
  # under load -- observed gaps of 20-90+ minutes instead of the
  # configured 3 minutes (project history). An external precise pinger
  # (cron-job.org, real every-3-minute schedule) calls this workflow's
  # dispatch API instead, which GitHub runs promptly since it's a direct
  # API trigger, not the throttled schedule event. The runner itself
  # still re-checks the real, configurable SESSION_START/SESSION_END/
  # TRADING_DAYS window (session.py, CLAUDE.md sections 2/7/8) before
  # doing anything, so an off-hours ping is still a harmless no-op.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run XAUUSD check
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENVIRONMENT: ${{ secrets.OANDA_ENVIRONMENT }}
          SESSION_START: ${{ secrets.SESSION_START }}
          SESSION_END: ${{ secrets.SESSION_END }}
          TRADING_DAYS: ${{ secrets.TRADING_DAYS }}
          XAUUSD_AMPLITUDE: ${{ secrets.XAUUSD_AMPLITUDE }}
          XAUUSD_CHANNEL_DEVIATION: ${{ secrets.XAUUSD_CHANNEL_DEVIATION }}
          XAUUSD_BASE_RISK_MULT: ${{ secrets.XAUUSD_BASE_RISK_MULT }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
          ACCOUNT_SIZES: ${{ secrets.ACCOUNT_SIZES }}
          RISK_PERCENTAGES: ${{ secrets.RISK_PERCENTAGES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python -m src.xauusd_runner
